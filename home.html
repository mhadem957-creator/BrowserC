<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+JP:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #F6F5F0;
      color: #121212;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 40px;
      overflow-x: hidden;
      position: relative;
    }

    /* Speed lines background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          -25deg,
          transparent,
          transparent 18px,
          rgba(18,18,18,0.035) 18px,
          rgba(18,18,18,0.035) 19px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Soft paper grain */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(18,18,18,0.04) 0.6px, transparent 0.6px);
      background-size: 4px 4px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
    }

    /* Main comic panel */
    .panel {
      background: #F6F5F0;
      border: 4px solid #121212;
      box-shadow: 8px 8px 0 #121212;
      padding: 28px 18px 22px;
      text-align: center;
      position: relative;
    }

    /* Corner stamps */
    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: #E60012;
      border: 2.5px solid #121212;
    }
    .panel::before { top: -8px; left: -8px; }
    .panel::after { bottom: -8px; right: -8px; }

    /* Anime eye / ink seal logo */
    .seal {
      width: 100px;
      height: 100px;
      margin: 0 auto 14px;
      border: 4px solid #121212;
      box-shadow: 5px 5px 0 #121212;
      background: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform: rotate(-3deg);
    }
    .seal .kanji {
      font-size: 48px;
      font-weight: 900;
      color: #F6F5F0;
      line-height: 1;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
    }
    .seal .spark {
      position: absolute;
      top: -12px;
      right: -14px;
      font-size: 22px;
      filter: drop-shadow(2px 2px 0 #121212);
    }

    .title {
      font-family: "Black Ops One", "Noto Sans JP", sans-serif;
      font-size: 42px;
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: 2px;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #E60012;
      margin-bottom: 22px;
    }

    /* Speech-bubble style search */
    .search-box {
      display: flex;
      width: 100%;
      border: 3.5px solid #121212;
      box-shadow: 5px 5px 0 #121212;
      background: #fff;
      position: relative;
    }
    .search-box::before {
      content: "";
      position: absolute;
      left: 22px;
      bottom: -14px;
      width: 16px;
      height: 14px;
      background: #fff;
      border-right: 3.5px solid #121212;
      border-bottom: 3.5px solid #121212;
      transform: skewX(-35deg);
      z-index: 0;
    }
    input[type="search"] {
      flex: 1;
      border: none;
      outline: none;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #121212;
      background: transparent;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    input[type="search"]::placeholder {
      color: rgba(18,18,18,0.35);
      font-weight: 600;
    }
    button.go {
      border: none;
      border-left: 3.5px solid #121212;
      background: #E60012;
      color: #F6F5F0;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      padding: 0 18px;
      cursor: pointer;
      position: relative;
      z-index: 1;
    }
    button.go:active {
      background: #b0000e;
    }

    /* Quick links as comic stickers */
    .stickers {
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sticker {
      text-decoration: none;
      color: #121212;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 12px 8px;
      border: 3px solid #121212;
      box-shadow: 3px 3px 0 #121212;
      background: #F6F5F0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.05s;
    }
    .sticker:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #121212;
    }
    .sticker:nth-child(1) { background: #fff5f5; }
    .sticker:nth-child(2) { background: #f5f8ff; }
    .sticker:nth-child(3) { background: #fffaf0; }
    .sticker:nth-child(4) { background: #f5fff8; }
    .sticker .ico { font-size: 16px; }

    .footer {
      margin-top: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      opacity: 0.4;
    }

    /* Floating manga burst */
    .burst {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%) rotate(-6deg);
      background: #E60012;
      color: #F6F5F0;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border: 2.5px solid #121212;
      box-shadow: 3px 3px 0 #121212;
      white-space: nowrap;
      z-index: 2;
    }
  
    .seal {
      overflow: hidden;
      padding: 0;
    }
    .seal .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .seal .kanji { display: none; }

  </style>
</head>
